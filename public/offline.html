<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - O2-5 Prediction Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: #fe00c5; /* Accent color */
        }
        p {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .btn {
            background-color: #fe00c5;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="background: #FE00C5; width: 80px; height: 80px; padding: 12px; border-radius: 20px; margin: 0 auto 30px; box-shadow: 0 10px 20px rgba(254, 0, 197, 0.3);">
            <img src="/logo.png" alt="O2-5 Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>OFFLINE</h1>
        <p>You are currently disconnected. Check your internet connection and try again.</p>
        <a href="/" class="btn">Try Reconnecting</a>
    </div>
</body>
</html>
